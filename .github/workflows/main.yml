name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS Simulator · build & unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Config.plist placeholder (real client id is not needed to build or unit-test)
        run: cp Config.plist.example.plist Config.plist

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        run: pod install --repo-update

      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Newest iOS runtime first: the app's deployment target (18.6) rules out older simulators.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return tuple(int(x) for x in m.groups()) if m else (0, 0)
          found = [(version(rt), d["udid"], d["name"], rt) for rt, ds in devices.items() if "iOS" in rt
                   for d in ds if d["name"].startswith("iPhone")]
          found.sort(reverse=True)
          print(found[0][2], found[0][3], file=sys.stderr)
          print(found[0][1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          xcodebuild test \
            -workspace LiveEvents.xcworkspace \
            -scheme LiveEvents \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
